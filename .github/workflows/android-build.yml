
name: Build LeoPrediksi APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode repository
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ekstrak project Android
        run: unzip -o LeoPrediksi-Android-HP-Build.zip -d .

      - name: Perbaiki konfigurasi project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("LeoPrediksi-Android")

          p = root / "build.gradle.kts"
          s = p.read_text()
          if "org.jetbrains.kotlin.plugin.compose" not in s:
              s = s.replace(
                  "plugins {",
                  'plugins {\n    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false',
                  1
              )
          p.write_text(s)

          p = root / "app/build.gradle.kts"
          s = p.read_text()

          if "org.jetbrains.kotlin.plugin.compose" not in s:
              s = s.replace(
                  "plugins {",
                  'plugins {\n    id("org.jetbrains.kotlin.plugin.compose")',
                  1
              )

          s = re.sub(r'composeOptions\s*\{[^}]*\}', '', s, flags=re.S)
          s = s.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )
          s = s.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          if "compileOptions {" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }""",
                  1
              )

          if "kotlinOptions {" not in s:
              s = s.replace(
                  "android {",
                  """android {
              kotlinOptions {
                  jvmTarget = "17"
              }""",
                  1
              )

          p.write_text(s)
          PY

          test -f LeoPrediksi-Android/settings.gradle.kts
          test -f LeoPrediksi-Android/app/google-services.json

      - name: Bangun APK
        run: gradle -p LeoPrediksi-Android :app:assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: LeoPrediksi-APK
          path: LeoPrediksi-Android/app/build/outputs/apk/debug/app-debug.apk
