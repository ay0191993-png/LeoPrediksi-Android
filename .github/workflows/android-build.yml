name: Build LeoPrediksi APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil repository
        uses: actions/checkout@v4

      - name: Ekstrak dan perbaiki Compose
        run: |
          unzip -o LeoPrediksi-Android-HP-Build.zip -d .
          python3 - <<'PY'
          from pathlib import Path

          root = Path("LeoPrediksi-Android")

          p = root / "build.gradle.kts"
          s = p.read_text()
          s = s.replace(
              'id("org.jetbrains.kotlin.android") version "2.0.21" apply false',
              'id("org.jetbrains.kotlin.android") version "2.0.21" apply false\n    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false'
          )
          p.write_text(s)

          p = root / "app/build.gradle.kts"
          s = p.read_text()
          s = s.replace(
              'id("org.jetbrains.kotlin.android")',
              'id("org.jetbrains.kotlin.android")\n    id("org.jetbrains.kotlin.plugin.compose")'
          )
          s = s.replace(
              '    composeOptions { kotlinCompilerExtensionVersion = "1.5.15" }\n',
              ''
          )
          p.write_text(s)
          PY
          test -f LeoPrediksi-Android/settings.gradle.kts

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Buat APK
        run: gradle -p LeoPrediksi-Android assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: LeoPrediksi-APK
          path: LeoPrediksi-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
